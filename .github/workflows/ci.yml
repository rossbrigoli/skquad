name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  control-plane:
    name: Control plane
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: skquad
          POSTGRES_USER: skquad
          POSTGRES_PASSWORD: skquad-ci-db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skquad -d skquad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: control-plane/go.mod
          cache-dependency-path: control-plane/go.sum
      - name: Go vet
        working-directory: control-plane
        run: go vet ./...
      - name: Go test
        working-directory: control-plane
        env:
          # Enables the Postgres-backed store tests; without it they skip.
          SKQUAD_TEST_DATABASE_URL: postgres://skquad:skquad-ci-db@127.0.0.1:5432/skquad?sslmode=disable
        run: go test ./... -coverpkg=./... -coverprofile=coverage.out
      - name: Coverage report and gate
        working-directory: control-plane
        run: |
          go tool cover -func=coverage.out | tail -n 25
          python3 ../scripts/go-coverage-gate.py coverage.out --min 62
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-control-plane
          path: control-plane/coverage.out

  operator:
    name: Operator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum
      - name: Go vet
        working-directory: operator
        run: go vet ./...
      - name: Go test
        working-directory: operator
        run: go test ./... -coverpkg=./... -coverprofile=coverage.out
      - name: Coverage report and gate
        working-directory: operator
        run: |
          go tool cover -func=coverage.out | tail -n 25
          python3 ../scripts/go-coverage-gate.py coverage.out --min 78
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-operator
          path: operator/coverage.out

  agent-runtime:
    name: Agent runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install package
        working-directory: agent-runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Install coverage tooling
        working-directory: agent-runtime
        run: python -m pip install coverage
      - name: Unit tests with coverage
        working-directory: agent-runtime
        run: |
          python -m coverage run --source=skquad_runtime -m unittest discover -s tests
          python -m coverage report
          python -m coverage xml -o coverage.xml
      - name: Coverage gate
        working-directory: agent-runtime
        run: python -m coverage report --fail-under=80
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-agent-runtime
          path: agent-runtime/coverage.xml
      - name: Compile Python
        working-directory: agent-runtime
        run: python -m py_compile skquad_runtime/*.py tests/*.py

  llm-gateway:
    name: LLM gateway
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: skquad
          POSTGRES_USER: skquad
          POSTGRES_PASSWORD: skquad-dev-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skquad -d skquad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Validate Python metadata and config
        working-directory: llm-gateway
        run: |
          python - <<'PY'
          import pathlib
          import tomllib

          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          deps = pyproject["project"]["dependencies"]
          assert any(dep.startswith("litellm") for dep in deps)
          assert any(dep.startswith("prisma") for dep in deps)
          assert any(dep.startswith("psycopg") for dep in deps)

          config = pathlib.Path("config.yaml").read_text()
          for required in ("model_list:", "general_settings:", "LITELLM_MASTER_KEY", "DATABASE_URL", "skquad_litellm_callbacks.proxy_handler_instance"):
              assert required in config
          assert pathlib.Path("skquad_litellm_callbacks.py").exists()
          PY
      - name: Install coverage tooling
        working-directory: llm-gateway
        run: python -m pip install --quiet coverage
      - name: Callback unit tests with coverage
        working-directory: llm-gateway
        run: |
          python -m coverage run --source=skquad_litellm_callbacks -m unittest discover -s tests -t tests
          python -m coverage report
          python -m coverage xml -o coverage.xml
      - name: Coverage gate
        working-directory: llm-gateway
        run: python -m coverage report --fail-under=90
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-llm-gateway
          path: llm-gateway/coverage.xml
      - name: Build gateway image
        run: docker build -t skquad-llm-gateway-ci ./llm-gateway
      - name: Callback unit tests against real LiteLLM
        run: |
          docker run --rm \
            -v "$PWD/llm-gateway/tests:/tests:ro" \
            --entrypoint python \
            skquad-llm-gateway-ci \
            -m unittest discover -s /tests -t /tests
      - name: Smoke test Skquad callback import
        run: |
          docker run --rm --entrypoint python skquad-llm-gateway-ci - <<'PY'
          import skquad_litellm_callbacks

          assert skquad_litellm_callbacks.proxy_handler_instance is not None
          print("OK: Skquad LiteLLM callback imports")
          PY

      - name: Smoke test Prisma client against Postgres
        run: |
          docker run --rm -i --network host --entrypoint python \
            -e DATABASE_URL='postgres://skquad:skquad-dev-password@127.0.0.1:5432/skquad?sslmode=disable&schema=litellm' \
            skquad-llm-gateway-ci - <<'PY'
          import asyncio
          from pathlib import Path

          from prisma import Prisma

          generated = Path("/usr/local/lib/python3.11/site-packages/prisma/client.py")
          assert generated.exists(), f"missing generated Prisma client: {generated}"

          async def main():
              db = Prisma()
              await db.connect()
              await db.disconnect()

          asyncio.run(main())
          print("OK: Prisma client can connect to Postgres")
          PY
      - name: Smoke test LiteLLM startup against Postgres
        run: |
          docker rm -f skquad-llm-gateway-smoke >/dev/null 2>&1 || true
          cleanup() {
            docker rm -f skquad-llm-gateway-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name skquad-llm-gateway-smoke --network host \
            -e LITELLM_MASTER_KEY='sk-test-master-key' \
            -e LITELLM_MIGRATION_DIR='/tmp/litellm-migrations' \
            -e DATABASE_URL='postgres://skquad:skquad-dev-password@127.0.0.1:5432/skquad?sslmode=disable&schema=litellm' \
            skquad-llm-gateway-ci --config /etc/skquad/config.yaml --host 0.0.0.0 --port 54000

          for _ in $(seq 1 90); do
            if curl --fail --silent --show-error http://127.0.0.1:54000/health/liveliness >/dev/null; then
              curl --fail --silent --show-error http://127.0.0.1:54000/health/readiness >/dev/null
              echo "OK: LiteLLM gateway started and passed readiness"
              exit 0
            fi
            if ! docker ps --format '{{.Names}}' | grep -qx skquad-llm-gateway-smoke; then
              docker logs skquad-llm-gateway-smoke
              exit 1
            fi
            sleep 2
          done

          docker logs skquad-llm-gateway-smoke
          exit 1

  integration-smoke:
    name: Integration smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # This job builds both Go modules. operator/go.mod requires a newer
          # language version than control-plane/go.mod, and setup-go v7 pins
          # GOTOOLCHAIN=local, so the toolchain has to be the higher of the two.
          go-version-file: operator/go.mod
          cache-dependency-path: |
            control-plane/go.sum
            operator/go.sum
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: azure/setup-helm@v5
      - name: Install agent runtime
        working-directory: agent-runtime
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e .
      - name: Run integration smoke suite
        run: python3 -m unittest discover -s tests/integration

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Lint chart
        run: helm lint charts/skquad
      - name: Render default chart
        run: helm template skquad charts/skquad --namespace skquad-system
      - name: Render provider-configured gateway chart
        run: |
          helm template skquad charts/skquad --namespace skquad-system -f - <<'EOF'
          llmGateway:
            masterKeySecret:
              name: skquad-litellm-master
              key: master-key
            config: |
              model_list:
                - model_name: local-llama
                  litellm_params:
                    model: openai/local-llama
                    api_base: http://llama-server.default.svc.cluster.local:8123/v1
                    api_key: os.environ/LOCAL_LLM_API_KEY
              general_settings:
                master_key: os.environ/LITELLM_MASTER_KEY
                database_url: os.environ/DATABASE_URL
                store_model_in_db: true
              litellm_settings:
                drop_params: true
                overwrite_user_with_key_hash: true
                success_callback: []
            extraEnv:
              - name: LOCAL_LLM_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: local-llm-api-key
                    key: api-key
          EOF
      - name: Render Traefik IngressRoute chart
        run: |
          helm template skquad charts/skquad --namespace skquad-system -f - <<'EOF'
          ingressRoute:
            enabled: true
            entryPoints:
              - web
          ingress:
            hosts:
              - host: skquad.lab
                paths:
                  - path: /api
                    pathType: Prefix
                    service: apiServer
                  - path: /
                    pathType: Prefix
                    service: web
          EOF

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests with coverage
        run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-web
          path: web/coverage/lcov.info
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  web-v2:
    name: Web v2
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-v2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-v2/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests with coverage
        run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-web-v2
          path: web-v2/coverage/lcov.info
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  # ---------------------------------------------------------------------------
  # Security jobs (Kanbunny S-102). Self-hosted on the in-cluster skquad runner:
  # SonarQube is unreachable from GitHub-hosted runners (Cloudflare Access gate),
  # so scans run where the server lives. Any Critical/High finding fails CI, and
  # images.yml only publishes after CI (including these) is green.
  # ---------------------------------------------------------------------------
  security-sonar:
    name: Security — SonarQube
    if: vars.SECURITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, skquad]
    timeout-minutes: 45
    env:
      SONAR_URL: http://sonarqube-sonarqube.sonarqube.svc.cluster.local:9000
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      KANBUNNY_URL: http://kanbunny.kanbunny.svc.cluster.local:3500
      KANBUNNY_TOKEN: ${{ secrets.KANBUNNY_TOKEN }}
      KANBUNNY_BOARD: e5b3865d-1d64-482c-b153-411b84a9b132
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          version: "17"
      - name: Cache SonarScanner CLI
        id: sonar-cli
        uses: actions/cache@v4
        with:
          path: .sonar-scanner
          key: sonar-scanner-cli-8.1.0.6389
      - name: Install SonarScanner CLI
        if: steps.sonar-cli.outputs.cache-hit != 'true'
        run: |
          curl -sSLo /tmp/sonar.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-8.1.0.6389-linux-x64.zip
          mkdir -p .sonar-scanner
          unzip -q /tmp/sonar.zip -d .sonar-scanner
      - name: Run SonarQube analysis
        env:
          SONAR_SCANNER_OPTS: "-Xmx1g"
        run: .sonar-scanner/sonar-scanner-*/bin/sonar-scanner -Dsonar.host.url="$SONAR_URL"
      - name: Critical/High severity gate (+ Kanbunny card)
        run: python3 scripts/sonar-severity-gate.py

  security-sca:
    name: Security — SCA
    if: vars.SECURITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, skquad]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: |
            control-plane/go.sum
            operator/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck control-plane
        working-directory: control-plane
        run: $(go env GOPATH)/bin/govulncheck ./...
      - name: govulncheck operator
        working-directory: operator
        run: $(go env GOPATH)/bin/govulncheck ./...
      - name: pip-audit agent-runtime
        run: |
          python3 -m venv /tmp/sca-venv
          /tmp/sca-venv/bin/pip install -q --upgrade pip pip-audit
          /tmp/sca-venv/bin/pip install -q ./agent-runtime
          /tmp/sca-venv/bin/pip-audit
      - name: npm audit web (high+ critical)
        working-directory: web
        run: npm audit --audit-level=high --package-lock-only
      - name: npm audit web-v2 (high+ critical)
        working-directory: web-v2
        run: npm audit --audit-level=high --package-lock-only

  security-sast:
    name: Security — SAST (gosec)
    if: vars.SECURITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, skquad]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: |
            control-plane/go.sum
            operator/go.sum
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: gosec control-plane (fail on HIGH/CRITICAL)
        working-directory: control-plane
        run: $(go env GOPATH)/bin/gosec -severity high -sort severity ./...
      - name: gosec operator (fail on HIGH/CRITICAL)
        working-directory: operator
        run: $(go env GOPATH)/bin/gosec -severity high -sort severity ./...
