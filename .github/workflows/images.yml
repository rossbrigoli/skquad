name: Images

# Publishing is gated on the CI workflow (tests + security scans, Kanbunny
# S-102): images are only pushed after CI succeeds on main. Release tags are
# expected to be cut from a green main; workflow_dispatch stays available as
# the manual override.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: read

env:
  DOCKERHUB_NAMESPACE: brigss007
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  GHCR_NAMESPACE: rossbrigoli

jobs:
  gate:
    name: CI gate
    runs-on: ubuntu-latest
    steps:
      - name: Require a successful CI run
        env:
          EVENT: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [ "$EVENT" = "workflow_run" ] && [ "$CONCLUSION" != "success" ]; then
            echo "CI conclusion is '$CONCLUSION' — refusing to publish images." >&2
            exit 1
          fi
          echo "Gate passed (event=$EVENT)."

  # S-141: one release version per pipeline run, shared by every component image.
  # build = buildBase + (Images run_number - runBase), from version.json — so the
  # build number auto-increments on every release and no file needs editing.
  version:
    name: Release version
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
      version_tag: ${{ steps.semver.outputs.version_tag }}
      commit: ${{ steps.semver.outputs.commit }}
      commit_short: ${{ steps.semver.outputs.commit_short }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: semver
        uses: ./.github/actions/skquad-version

      - name: Report release version
        run: |
          echo "## Skquad release ${{ steps.semver.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "commit: ${{ steps.semver.outputs.commit_short }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Release version: ${{ steps.semver.outputs.version }} (commit ${{ steps.semver.outputs.commit_short }})"

  build:
    name: Build ${{ matrix.component }} image
    needs: [gate, version]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api-server
            context: control-plane
            image: skquad-api-server
          - component: operator
            context: operator
            image: skquad-operator
          - component: agent-runtime
            context: agent-runtime
            image: skquad-agent-runtime
          - component: llm-gateway
            context: llm-gateway
            image: skquad-llm-gateway
          - component: web
            context: web
            image: skquad-web

    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run executes from the default branch's copy of this file;
          # build the commit that actually triggered the CI run.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.GHCR_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=${{ needs.version.outputs.major }}.${{ needs.version.outputs.minor }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish GHCR image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SKQUAD_VERSION=${{ needs.version.outputs.version }}
            SKQUAD_COMMIT=${{ needs.version.outputs.commit }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Docker Hub metadata
        if: github.event_name != 'pull_request'
        id: dockerhub-meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=${{ needs.version.outputs.major }}.${{ needs.version.outputs.minor }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Mirror image to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.dockerhub-meta.outputs.tags }}
          labels: ${{ steps.dockerhub-meta.outputs.labels }}
          build-args: |
            SKQUAD_VERSION=${{ needs.version.outputs.version }}
            SKQUAD_COMMIT=${{ needs.version.outputs.commit }}
          cache-from: type=gha,scope=${{ matrix.component }}
