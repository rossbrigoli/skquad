# drill-cronjob.yaml — TG-9 (S-255) weekly security drill (manifest only).
#
# GATING: this manifest is NOT deployed by default. The Helm chart value
# `securityDrills.enabled` (added in a later TG-9 slice) will template it.
# Do not apply blindly; review first.
#
# The drill pod runs bypass_suite.sh + secret_probe.sh from a ConfigMap
# created by the chart from scripts/security-drills/ (chart-side step):
#   kubectl -n skquad-system create configmap skquad-drill-scripts \
#     --from-file=scripts/security-drills/lib.sh \
#     --from-file=scripts/security-drills/bypass_suite.sh \
#     --from-file=scripts/security-drills/secret_probe.sh \
#     --dry-run=client -o yaml   # (chart templates this; shown for reference)
#
# RBAC (least privilege, namespace-scoped — NO cluster roles):
#   skquad-system  : pods get/list            (secret inventory)
#   skquad-browser : pods get/list           (secret inventory + browser checks)
#   squad drill ns : pods create/delete/get/list/wait (throwaway agent-position pod)
#                  + pods/portforward        (revocation harness, if enabled)
# NOTE: squad namespaces are dynamic (one per squad). The example binds the
# squad-drill role to the TEST squad namespace only. For multi-squad drills the
# chart/operator must replicate the RoleBinding per squad ns — deliberately NOT
# a ClusterRole.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: skquad-drill
  namespace: skquad-system
  labels:
    app.kubernetes.io/name: skquad
    app.kubernetes.io/component: security-drill
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: skquad-drill-inventory
  namespace: skquad-system
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: skquad-drill-inventory
  namespace: skquad-browser
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: skquad-drill-agentpod
  namespace: squad-test-squad-6d9ed084
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: skquad-drill-inventory
  namespace: skquad-system
subjects:
  - kind: ServiceAccount
    name: skquad-drill
    namespace: skquad-system
roleRef:
  kind: Role
  name: skquad-drill-inventory
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: skquad-drill-inventory
  namespace: skquad-browser
subjects:
  - kind: ServiceAccount
    name: skquad-drill
    namespace: skquad-system
roleRef:
  kind: Role
  name: skquad-drill-inventory
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: skquad-drill-agentpod
  namespace: squad-test-squad-6d9ed084
subjects:
  - kind: ServiceAccount
    name: skquad-drill
    namespace: skquad-system
roleRef:
  kind: Role
  name: skquad-drill-agentpod
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: skquad-security-drill
  namespace: skquad-system
  labels:
    app.kubernetes.io/name: skquad
    app.kubernetes.io/component: security-drill
spec:
  # Weekly, Sun 16:30 UTC ≈ Mon 03:30 ACDT (Adelaide). Low-traffic window.
  schedule: "30 16 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: skquad
            app.kubernetes.io/component: security-drill
        spec:
          serviceAccountName: skquad-drill
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            fsGroup: 10001
          containers:
            - name: drill
              # kubectl + bash + curl + jq in one image. Pin by digest in the
              # chart (value securityDrills.image).
              image: alpine/k8s:1.31.9
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  export KUBECONFIG=""   # in-cluster SA config
                  cd /drills
                  bash bypass_suite.sh; BYPASS=$?
                  bash secret_probe.sh; PROBE=$?
                  echo "bypass=$BYPASS secret-probe=$PROBE"
                  # Non-zero on any FAIL so the failed job surfaces in alerts.
                  [ "$BYPASS" -eq 0 ] && [ "$PROBE" -eq 0 ]
              env:
                - name: SQUAD_NS
                  value: "squad-test-squad-6d9ed084"
                - name: RESULTS_FILE
                  value: "/tmp/results.json"
              volumeMounts:
                - name: drills
                  mountPath: /drills
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          volumes:
            - name: drills
              configMap:
                name: skquad-drill-scripts
                defaultMode: 0555
