[project]
name = "skquad-llm-gateway"
version = "0.1.0"
description = "skquad central LLM gateway (LiteLLM proxy): metering, cost, BYOM, permissions"
requires-python = ">=3.11"
dependencies = [
    "litellm[proxy]>=1.40",
    "prisma>=0.15",
    "psycopg[binary]>=3.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Flat layout with two top-level modules: declare explicitly so setuptools
# auto-discovery doesn't refuse the build (S-200 added vision_gate).
py-modules = ["skquad_litellm_callbacks", "vision_gate"]
