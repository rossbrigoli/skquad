[project]
name = "skquad-llm-gateway"
version = "0.1.0"
description = "skquad central LLM gateway (LiteLLM proxy): metering, cost, BYOM, permissions"
requires-python = ">=3.11"
dependencies = [
    # Pinned exactly for deterministic rebuilds (S-220): matches the tested
    # version running live as of 2026-10-04. Bump deliberately, not by accident.
    "litellm[proxy]==1.103.2",
    "prisma>=0.15",
    "psycopg[binary]>=3.1",
]

[build-system]
requires = ["setuptools>=83.0.0"]  # PYSEC-2026-3447 / GHSA-h35f-9h28-mq5c: <83 sdist NFD-exclusion bypass
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Flat layout with two top-level modules: declare explicitly so setuptools
# auto-discovery doesn't refuse the build (S-200 added vision_gate).
py-modules = ["skquad_litellm_callbacks", "vision_gate"]
