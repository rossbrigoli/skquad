# LiteLLM proxy configuration for the skquad LLM gateway.
#
# The gateway is the single, model-agnostic endpoint all agent LLM calls flow
# through. It meters tokens, computes cost, enforces agent permissions, and
# routes BYOM calls. See docs/llm-gateway.md.
#
# The Helm chart injects this config by default. Keep model_list empty in local
# development unless a provider is explicitly configured.
model_list: []
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
litellm_settings:
  drop_params: true
  overwrite_user_with_key_hash: true
  callbacks: skquad_litellm_callbacks.proxy_handler_instance
  success_callback: []
router_settings:
  # ADR-0010 D7 failure-class policy defaults. The authoritative copy is
  # compiled onto every agent's virtual key by the control plane
  # (router_settings on /key/generate and /key/update; key > team > global
  # precedence). These gateway-wide defaults keep non-key-managed traffic
  # on the same policy: never retry 400-class or upstream-auth errors,
  # retry transient classes before falling back.
  retry_policy:
    BadRequestErrorRetries: 0
    AuthenticationErrorRetries: 0
    RateLimitErrorRetries: 2
    TimeoutErrorRetries: 2
    InternalServerErrorRetries: 2
    ServiceUnavailableErrorRetries: 2
