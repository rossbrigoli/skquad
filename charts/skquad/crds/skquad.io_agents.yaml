apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agents.skquad.io
spec:
  group: skquad.io
  names:
    kind: Agent
    listKind: AgentList
    plural: agents
    singular: agent
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - agentId
                - desiredActive
                - squadId
              properties:
                agentId:
                  type: string
                squadId:
                  type: string
                role:
                  type: string
                systemPrompt:
                  type: string
                defaultProviderId:
                  type: string
                defaultModel:
                  type: string
                image:
                  type: string
                credentialSecret:
                  type: string
                virtualKeySecret:
                  type: string
                controlPlaneUrl:
                  type: string
                llmGatewayUrl:
                  type: string
                permissions:
                  x-kubernetes-preserve-unknown-fields: true
                idleTimeout:
                  type: string
                desiredActive:
                  type: boolean
            status:
              type: object
              properties:
                readyDeployment:
                  type: string
                replicas:
                  type: integer
                  format: int32
                ready:
                  type: boolean
                phase:
                  type: string
                reason:
                  type: string
                idleSince:
                  type: string
                  format: date-time
                updatedAt:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
      additionalPrinterColumns:
        - name: Squad
          type: string
          jsonPath: .spec.squadId
        - name: Active
          type: boolean
          jsonPath: .spec.desiredActive
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
