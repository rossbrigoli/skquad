# Default values for the skquad Helm chart.
# See docs/deployment-operator.md §6 for the full chart layout.
image:
  apiServer:
    repository: ghcr.io/rossbrigoli/skquad-api-server
    tag: "0.1.0"
  operator:
    repository: ghcr.io/rossbrigoli/skquad-operator
    tag: "0.1.0"
  llmGateway:
    repository: ghcr.io/rossbrigoli/skquad-llm-gateway
    tag: "0.1.0"
  agentRuntime:
    repository: ghcr.io/rossbrigoli/skquad-agent-runtime
    tag: "0.1.0"
  web:
    repository: ghcr.io/rossbrigoli/skquad-web
    tag: "0.1.0"

replicas:
  apiServer: 2
  llmGateway: 2
  operator: 1
  web: 1

# S-130: overrides for the component versions shown on the About page.
# Leave empty to use the image tag deployed for each component.
# S-141: with the release pipeline those tags are semantic (major.minor.build,
# e.g. 0.1.100), so the About page shows the release version by default.
version:
  apiServer: ""
  operator: ""
  agentRuntime: ""
  llmGateway: ""
  webUi: ""

# S-141: commit the release was built from, shown on the About page next to the
# version. The Images workflow prints it per release; leave empty for "unknown".
git:
  commit: ""

namespace:
  create: true

postgres:
  enabled: true
  image: pgvector/pgvector:pg16
  imagePullPolicy: IfNotPresent
  existingSecret: ""
  secretKeys:
    database: database
    username: username
    password: password
    databaseUrl: database-url
  database: skquad
  user: skquad
  password: skquad-dev-password
  storage:
    size: 10Gi
  # S6864/S6870: containers need explicit memory + storage limits.
  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 512Mi
      ephemeral-storage: 2Gi

observability:
  enabled: false   # toggle Prometheus metrics (see docs/observability-metering.md)

agent:
  idleTimeout: 300s
  taskPollIntervalSeconds: "30"
  inboxPollIntervalSeconds: "30"
  inboxBatchSize: "5"
  taskTimeoutSeconds: "900"
  maxLLMSteps: "8"
  taskSummaryMaxChars: "4000"

operator:
  leaderElection: true
  metricsBindAddress: ":8080"
  healthProbeBindAddress: ":8081"
  imagePullPolicy: IfNotPresent
  # S-139: platform-wide per-agent storage cap enforced at operator
  # admission (defense in depth behind the API validation). Agent CRs
  # requesting more than this never get a PVC: WorkspaceReady=False /
  # StorageSizeExceedsPlatformMax. Keep in sync with
  # apiServer.maxAgentStorageSize unless deliberately stricter.
  maxAgentStorage: 10Gi
  # S6864: explicit memory limit.
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: 256Mi
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

apiServer:
  imagePullPolicy: IfNotPresent
  authMode: dev
  databaseUrl: ""
  runtimeControlPlaneUrl: ""
  runtimeLlmGatewayUrl: ""
  # Agent workspace storage (S-138). Platform-admin knobs surfaced to the
  # control plane as SKQUAD_DEFAULT_AGENT_STORAGE_SIZE /
  # SKQUAD_MAX_AGENT_STORAGE / SKQUAD_STORAGE_CLASS. Squad owners pick a
  # size up to maxAgentStorageSize in the UI/API; storageClass is never
  # tenant-selectable — "" omits storageClassName so the cluster default
  # applies (S-135 portability rule).
  defaultAgentStorageSize: 2Gi
  maxAgentStorageSize: 10Gi
  storageClass: ""
  memoryEmbeddings:
    enabled: false
    model: ""
  databaseUrlSecret:
    name: ""
    key: database-url
  oidc:
    issuer: ""
    audience: ""
    # IdP groups bound to platform_admin (rendered as SKQUAD_OIDC_ADMIN_GROUPS).
    # With Dex + GitHub these are org/team slugs, e.g. ross-private-cloud:platform.
    adminGroups: []
  # S6864: explicit memory limit.
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: 512Mi
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

# ---------------------------------------------------------------------------
# Break-glass admin path (OIDC-independent).
#
# Everything except the two credentials is a plain ConfigMap value, so the
# feature can be flipped on/off without re-sealing anything. The credentials
# come from a SealedSecret named `secretName`.
#
# REACHABILITY: LAN + Tailscale only. Requests that arrive through Cloudflare
# are refused regardless of source IP, because Cloudflare always stamps CF-Ray
# on what it proxies. Use the internal address (http://skquad.lab), never
# the public hostname, when using break-glass.
#
# Generate credentials with:
#   go run ./control-plane/cmd/breakglass-hash
# ---------------------------------------------------------------------------
breakGlass:
  # Flip this in the ConfigMap to enable/disable. Default off.
  enabled: false
  username: breakglass
  tokenTTL: 60m
  maxAttempts: 5
  window: 15m
  # RFC1918 LAN + Tailscale CGNAT range.
  allowedCIDRs:
    - 192.168.68.0/24
    - 100.64.0.0/10
  # SealedSecret name holding `password-hash` and `jwt-key`.
  secretName: skquad-breakglass
  # Only for local/dev. Leave empty under GitOps — put the values in the
  # SealedSecret instead so they never land in git.
  passwordHash: ""
  jwtKey: ""

llmGateway:
  imagePullPolicy: IfNotPresent
  port: 4000
  masterKey: sk-skquad-dev-master-key
  masterKeySecret:
    name: ""
    key: master-key
  databaseUrl: ""
  databaseUrlSecret:
    name: ""
    key: database-url
  migrationDir: /tmp/litellm-migrations
  extraEnv: []
  extraEnvFrom: []
  probes:
    startup:
      enabled: true
      failureThreshold: 60
      periodSeconds: 10
      timeoutSeconds: 2
    liveness:
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    readiness:
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
  config: |
    model_list: []
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
      store_model_in_db: true
    litellm_settings:
      drop_params: true
      overwrite_user_with_key_hash: true
      callbacks: skquad_litellm_callbacks.proxy_handler_instance
      success_callback: []
  # S6864: explicit memory limit (litellm is Python; give it headroom).
  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 1Gi

web:
  # The skquad UI. Formerly `web-v2`; the v1 UI was retired 2026-09-26 and the
  # redesign was renamed to `web`. "web" now always means the redesigned UI.
  enabled: true
  imagePullPolicy: IfNotPresent
  port: 3000
  apiBaseUrl: /api/v1
  # Externally visible origin used for all app redirects, e.g.
  # https://skquad.rossbrigoli.com. Empty = derive from x-forwarded-*
  # headers, then the OIDC redirect URL's origin.
  publicBaseUrl: ""
  # S6864: explicit memory limit.
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: 512Mi
  # UIv2-13: generic OIDC login (authorization code + PKCE). Works with any
  # IdP exposing .well-known/openid-configuration (Dex, Keycloak, Entra…).
  # When disabled the UI keeps the paste-a-token dev gate.
  oidc:
    enabled: false
    issuer: ""
    clientId: "skquad"
    redirectUrl: ""
    secretName: "skquad-web-oidc"
    clientSecretKey: "client-secret"
    scopes: "openid profile email offline_access"

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: skquad.local
      paths:
        - path: /api
          pathType: Prefix
          service: apiServer
        - path: /
          pathType: Prefix
          service: web
  tls: []

ingressRoute:
  enabled: false
  entryPoints:
    - web
