# Default values for the skquad Helm chart.
# See docs/deployment-operator.md §6 for the full chart layout.
image:
  apiServer:
    repository: ghcr.io/rossbrigoli/skquad-api-server
    tag: "0.1.0"
  operator:
    repository: ghcr.io/rossbrigoli/skquad-operator
    tag: "0.1.0"
  llmGateway:
    repository: ghcr.io/rossbrigoli/skquad-llm-gateway
    tag: "0.1.0"
  agentRuntime:
    repository: ghcr.io/rossbrigoli/skquad-agent-runtime
    tag: "0.1.0"
  web:
    repository: ghcr.io/rossbrigoli/skquad-web
    tag: "0.1.0"
  webV2:
    repository: ghcr.io/rossbrigoli/skquad-web-v2
    tag: "0.1.0"

replicas:
  apiServer: 2
  llmGateway: 2
  operator: 1
  web: 1
  webV2: 1

namespace:
  create: true

postgres:
  enabled: true
  image: pgvector/pgvector:pg16
  imagePullPolicy: IfNotPresent
  existingSecret: ""
  secretKeys:
    database: database
    username: username
    password: password
    databaseUrl: database-url
  database: skquad
  user: skquad
  password: skquad-dev-password
  storage:
    size: 10Gi
  # S6864/S6870: containers need explicit memory + storage limits.
  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 512Mi
      ephemeral-storage: 2Gi

observability:
  enabled: false   # toggle Prometheus metrics (see docs/observability-metering.md)

agent:
  idleTimeout: 300s
  taskPollIntervalSeconds: "30"
  inboxPollIntervalSeconds: "30"
  inboxBatchSize: "5"
  taskTimeoutSeconds: "900"
  maxLLMSteps: "8"
  taskSummaryMaxChars: "4000"

operator:
  leaderElection: true
  metricsBindAddress: ":8080"
  healthProbeBindAddress: ":8081"
  imagePullPolicy: IfNotPresent
  # S6864: explicit memory limit.
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: 256Mi
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

apiServer:
  imagePullPolicy: IfNotPresent
  authMode: dev
  databaseUrl: ""
  runtimeControlPlaneUrl: ""
  runtimeLlmGatewayUrl: ""
  memoryEmbeddings:
    enabled: false
    model: ""
  databaseUrlSecret:
    name: ""
    key: database-url
  oidc:
    issuer: ""
    audience: ""
    # IdP groups bound to platform_admin (rendered as SKQUAD_OIDC_ADMIN_GROUPS).
    # With Dex + GitHub these are org/team slugs, e.g. ross-private-cloud:platform.
    adminGroups: []
  # S6864: explicit memory limit.
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: 512Mi
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

# ---------------------------------------------------------------------------
# Break-glass admin path (OIDC-independent).
#
# Everything except the two credentials is a plain ConfigMap value, so the
# feature can be flipped on/off without re-sealing anything. The credentials
# come from a SealedSecret named `secretName`.
#
# REACHABILITY: LAN + Tailscale only. Requests that arrive through Cloudflare
# are refused regardless of source IP, because Cloudflare always stamps CF-Ray
# on what it proxies. Use the internal address (http://skquad-v2.lab), never
# the public hostname, when using break-glass.
#
# Generate credentials with:
#   go run ./control-plane/cmd/breakglass-hash
# ---------------------------------------------------------------------------
breakGlass:
  # Flip this in the ConfigMap to enable/disable. Default off.
  enabled: false
  username: breakglass
  tokenTTL: 60m
  maxAttempts: 5
  window: 15m
  # RFC1918 LAN + Tailscale CGNAT range.
  allowedCIDRs:
    - 192.168.68.0/24
    - 100.64.0.0/10
  # SealedSecret name holding `password-hash` and `jwt-key`.
  secretName: skquad-breakglass
  # Only for local/dev. Leave empty under GitOps — put the values in the
  # SealedSecret instead so they never land in git.
  passwordHash: ""
  jwtKey: ""

llmGateway:
  imagePullPolicy: IfNotPresent
  port: 4000
  masterKey: sk-skquad-dev-master-key
  masterKeySecret:
    name: ""
    key: master-key
  databaseUrl: ""
  databaseUrlSecret:
    name: ""
    key: database-url
  migrationDir: /tmp/litellm-migrations
  extraEnv: []
  extraEnvFrom: []
  probes:
    startup:
      enabled: true
      failureThreshold: 60
      periodSeconds: 10
      timeoutSeconds: 2
    liveness:
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    readiness:
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
  config: |
    model_list: []
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
      store_model_in_db: true
    litellm_settings:
      drop_params: true
      overwrite_user_with_key_hash: true
      callbacks: skquad_litellm_callbacks.proxy_handler_instance
      success_callback: []
  # S6864: explicit memory limit (litellm is Python; give it headroom).
  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 1Gi

web:
  # v1 UI retired 2026-09-24 (S-113 WP8 prep): all new UI work lands in web-v2.
  # Flag added so the app can disable v1; default true keeps existing installs
  # unchanged until they opt out.
  enabled: true
  imagePullPolicy: IfNotPresent
  port: 3000
  apiBaseUrl: /api/v1
  # S6864: explicit memory limit.
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: 512Mi

# webV2 is the redesigned UI (docs/UI-V2-PLAN.md). Disabled by default so it
# is a no-op for existing installs; enable alongside a skquad-v2.* ingress host
# for A/B testing against the same control-plane API.
webV2:
  enabled: false
  imagePullPolicy: IfNotPresent
  port: 3000
  apiBaseUrl: /api/v1
  # Externally visible origin used for all app redirects, e.g.
  # https://skquad-v2.rossbrigoli.com. Empty = derive from x-forwarded-*
  # headers, then the OIDC redirect URL's origin.
  publicBaseUrl: ""
  resources: {}
  # UIv2-13: generic OIDC login (authorization code + PKCE). Works with any
  # IdP exposing .well-known/openid-configuration (Dex, Keycloak, Entra…).
  # When disabled the UI keeps the paste-a-token dev gate.
  oidc:
    enabled: false
    issuer: ""
    clientId: "skquad-v2"
    redirectUrl: ""
    secretName: "skquad-web-v2-oidc"
    clientSecretKey: "client-secret"
    scopes: "openid profile email offline_access"

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: skquad.local
      paths:
        - path: /api
          pathType: Prefix
          service: apiServer
        - path: /
          pathType: Prefix
          service: web
  tls: []

ingressRoute:
  enabled: false
  entryPoints:
    - web
