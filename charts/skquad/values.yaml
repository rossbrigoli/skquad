# Default values for the skquad Helm chart.
# See docs/deployment-operator.md §6 for the full chart layout.
image:
  apiServer:
    repository: ghcr.io/rossbrigoli/skquad-api-server
    tag: "0.1.0"
  operator:
    repository: ghcr.io/rossbrigoli/skquad-operator
    tag: "0.1.0"
  llmGateway:
    repository: ghcr.io/rossbrigoli/skquad-llm-gateway
    tag: "0.1.0"
  agentRuntime:
    repository: ghcr.io/rossbrigoli/skquad-agent-runtime
    tag: "0.1.0"
  web:
    repository: ghcr.io/rossbrigoli/skquad-web
    tag: "0.1.0"
  webV2:
    repository: ghcr.io/rossbrigoli/skquad-web-v2
    tag: "0.1.0"

replicas:
  apiServer: 2
  llmGateway: 2
  operator: 1
  web: 1
  webV2: 1

namespace:
  create: true

postgres:
  enabled: true
  image: pgvector/pgvector:pg16
  imagePullPolicy: IfNotPresent
  existingSecret: ""
  secretKeys:
    database: database
    username: username
    password: password
    databaseUrl: database-url
  database: skquad
  user: skquad
  password: skquad-dev-password
  storage:
    size: 10Gi
  resources: {}

observability:
  enabled: false   # toggle Prometheus metrics (see docs/observability-metering.md)

agent:
  idleTimeout: 300s
  taskPollIntervalSeconds: "30"
  inboxPollIntervalSeconds: "30"
  inboxBatchSize: "5"
  taskTimeoutSeconds: "900"
  maxLLMSteps: "8"
  taskSummaryMaxChars: "4000"

operator:
  leaderElection: true
  metricsBindAddress: ":8080"
  healthProbeBindAddress: ":8081"
  imagePullPolicy: IfNotPresent
  resources: {}
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

apiServer:
  imagePullPolicy: IfNotPresent
  authMode: dev
  databaseUrl: ""
  runtimeControlPlaneUrl: ""
  runtimeLlmGatewayUrl: ""
  memoryEmbeddings:
    enabled: false
    model: ""
  databaseUrlSecret:
    name: ""
    key: database-url
  oidc:
    issuer: ""
    audience: ""
  resources: {}
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

llmGateway:
  imagePullPolicy: IfNotPresent
  port: 4000
  masterKey: sk-skquad-dev-master-key
  masterKeySecret:
    name: ""
    key: master-key
  databaseUrl: ""
  databaseUrlSecret:
    name: ""
    key: database-url
  migrationDir: /tmp/litellm-migrations
  extraEnv: []
  extraEnvFrom: []
  probes:
    startup:
      enabled: true
      failureThreshold: 60
      periodSeconds: 10
      timeoutSeconds: 2
    liveness:
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    readiness:
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
  config: |
    model_list: []
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
      store_model_in_db: true
    litellm_settings:
      drop_params: true
      overwrite_user_with_key_hash: true
      callbacks: skquad_litellm_callbacks.proxy_handler_instance
      success_callback: []
  resources: {}

web:
  imagePullPolicy: IfNotPresent
  port: 3000
  apiBaseUrl: /api/v1
  resources: {}

# webV2 is the redesigned UI (docs/UI-V2-PLAN.md). Disabled by default so it
# is a no-op for existing installs; enable alongside a skquad-v2.* ingress host
# for A/B testing against the same control-plane API.
webV2:
  enabled: false
  imagePullPolicy: IfNotPresent
  port: 3000
  apiBaseUrl: /api/v1
  resources: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: skquad.local
      paths:
        - path: /api
          pathType: Prefix
          service: apiServer
        - path: /
          pathType: Prefix
          service: web
  tls: []

ingressRoute:
  enabled: false
  entryPoints:
    - web
