# Default values for the skquad Helm chart.
# See docs/deployment-operator.md §6 for the full chart layout.
image:
  apiServer:
    repository: ghcr.io/rossbrigoli/skquad-api-server
    tag: "0.1.0"
  operator:
    repository: ghcr.io/rossbrigoli/skquad-operator
    tag: "0.1.0"
  llmGateway:
    repository: ghcr.io/rossbrigoli/skquad-llm-gateway
    tag: "0.1.0"
  agentRuntime:
    repository: ghcr.io/rossbrigoli/skquad-agent-runtime
    tag: "0.1.0"
  web:
    repository: ghcr.io/rossbrigoli/skquad-web
    tag: "0.1.0"

replicas:
  apiServer: 2
  llmGateway: 2
  operator: 1
  web: 1

# S-130: overrides for the component versions shown on the About page.
# Leave empty to use the image tag deployed for each component.
# S-141: with the release pipeline those tags are semantic (major.minor.build,
# e.g. 0.1.100), so the About page shows the release version by default.
version:
  apiServer: ""
  operator: ""
  agentRuntime: ""
  llmGateway: ""
  webUi: ""

# S-141: commit the release was built from, shown on the About page next to the
# version. The Images workflow prints it per release; leave empty for "unknown".
git:
  commit: ""

namespace:
  create: true

postgres:
  enabled: true
  image: pgvector/pgvector:pg16
  imagePullPolicy: IfNotPresent
  existingSecret: ""
  secretKeys:
    database: database
    username: username
    password: password
    databaseUrl: database-url
  database: skquad
  user: skquad
  password: skquad-dev-password
  storage:
    size: 10Gi
  # S6864/S6870: containers need explicit memory + storage limits.
  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 512Mi
      ephemeral-storage: 2Gi

observability:
  enabled: false   # toggle Prometheus metrics (see docs/observability-metering.md)

agent:
  # S-183: scale to zero only after 15 minutes of no agent activity.
  # This is the deploy-time fallback; the live value is the platform
  # setting (platform_settings.idle_scale_to_zero_seconds), changeable
  # by platform admins in the Settings screen without redeploying.
  idleTimeout: 900s
  taskPollIntervalSeconds: "30"
  inboxPollIntervalSeconds: "30"
  inboxBatchSize: "5"
  taskTimeoutSeconds: "900"
  maxLLMSteps: "8"
  taskSummaryMaxChars: "4000"
  # S-147 (WP6): promptFetchEnabled removed. Agents always fetch the
  # composed four-tier prompt (platform > org > squad > agent) from the
  # control-plane at wake; the legacy env prompt path no longer exists.
  # S-152/BT-5a (ADR-0012): default for the agent-pod built-in tools kill
  # switch (SKQUAD_BUILTIN_TOOLS_ENABLED). "true" = enabled (runtime
  # default); set "false" to disable exec/web_fetch/web_search fleet-wide
  # regardless of control-plane config. Flows to the operator as
  # SKQUAD_AGENT_BUILTIN_TOOLS_ENABLED, which injects it into every agent pod.
  builtinToolsEnabled: "true"

operator:
  leaderElection: true
  metricsBindAddress: ":8080"
  healthProbeBindAddress: ":8081"
  imagePullPolicy: IfNotPresent
  # S-139: platform-wide per-agent storage cap enforced at operator
  # admission (defense in depth behind the API validation). Agent CRs
  # requesting more than this never get a PVC: WorkspaceReady=False /
  # StorageSizeExceedsPlatformMax. Keep in sync with
  # apiServer.maxAgentStorageSize unless deliberately stricter.
  maxAgentStorage: 10Gi
  # S6864: explicit memory limit.
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: 256Mi
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

apiServer:
  imagePullPolicy: IfNotPresent
  authMode: dev
  databaseUrl: ""
  runtimeControlPlaneUrl: ""
  runtimeLlmGatewayUrl: ""
  # Agent workspace storage (S-138). Platform-admin knobs surfaced to the
  # control plane as SKQUAD_DEFAULT_AGENT_STORAGE_SIZE /
  # SKQUAD_MAX_AGENT_STORAGE / SKQUAD_STORAGE_CLASS. Squad owners pick a
  # size up to maxAgentStorageSize in the UI/API; storageClass is never
  # tenant-selectable — "" omits storageClassName so the cluster default
  # applies (S-135 portability rule).
  defaultAgentStorageSize: 2Gi
  maxAgentStorageSize: 10Gi
  storageClass: ""
  memoryEmbeddings:
    # S-212: semantic memory search (RAG). Requires the embedder
    # (see embedder.* below) registered in the gateway.
    enabled: true
    model: "qwen3-embed-0.6b"
    # Optional override of the embedder endpoint used for gateway
    # registration (SKQUAD_MEMORY_EMBEDDER_URL). "" → chart default.
    embedderUrl: ""
  databaseUrlSecret:
    name: ""
    key: database-url
  # S-152/BT-5a (ADR-0012): web search provider keys for the control-plane
  # search proxy. CONTROL-PLANE ONLY — these never reach agent pods (the runtime
  # calls POST /api/v1/tools/web_search and never sees the keys). The default
  # provider (duckduckgo) needs no key. For brave/perplexity either supply an
  # inline value (dev only; rendered into a Secret by this chart) or manage the
  # Secret externally (GitOps/SealedSecret) under the same secretName with keys
  # `brave-api-key` and `perplexity-api-key`.
  search:
    secretName: skquad-search-keys
    braveApiKey: ""
    perplexityApiKey: ""
  oidc:
    issuer: ""
    audience: ""
    # IdP groups bound to platform_admin (rendered as SKQUAD_OIDC_ADMIN_GROUPS).
    # With Dex + GitHub these are org/team slugs, e.g. ross-private-cloud:platform.
    adminGroups: []
  # S6864: explicit memory limit.
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: 512Mi
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

# ---------------------------------------------------------------------------
# Break-glass admin path (OIDC-independent).
#
# Everything except the two credentials is a plain ConfigMap value, so the
# feature can be flipped on/off without re-sealing anything. The credentials
# come from a SealedSecret named `secretName`.
#
# REACHABILITY: LAN + Tailscale only. Requests that arrive through Cloudflare
# are refused regardless of source IP, because Cloudflare always stamps CF-Ray
# on what it proxies. Use the internal address (http://skquad.lab), never
# the public hostname, when using break-glass.
#
# Generate credentials with:
#   go run ./control-plane/cmd/breakglass-hash
# ---------------------------------------------------------------------------
breakGlass:
  # Flip this in the ConfigMap to enable/disable. Default off.
  enabled: false
  username: breakglass
  tokenTTL: 60m
  maxAttempts: 5
  window: 15m
  # RFC1918 LAN + Tailscale CGNAT range.
  allowedCIDRs:
    - 192.168.68.0/24
    - 100.64.0.0/10
  # SealedSecret name holding `password-hash` and `jwt-key`.
  secretName: skquad-breakglass
  # Only for local/dev. Leave empty under GitOps — put the values in the
  # SealedSecret instead so they never land in git.
  passwordHash: ""
  jwtKey: ""

llmGateway:
  imagePullPolicy: IfNotPresent
  port: 4000
  masterKey: sk-skquad-dev-master-key
  masterKeySecret:
    name: ""
    key: master-key
  databaseUrl: ""
  databaseUrlSecret:
    name: ""
    key: database-url
  migrationDir: /tmp/litellm-migrations
  extraEnv: []
  extraEnvFrom: []
  probes:
    startup:
      enabled: true
      failureThreshold: 60
      periodSeconds: 10
      timeoutSeconds: 2
    liveness:
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    readiness:
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
  config: |
    model_list: []
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
      store_model_in_db: true
    litellm_settings:
      drop_params: true
      overwrite_user_with_key_hash: true
      callbacks: skquad_litellm_callbacks.proxy_handler_instance
      success_callback: []
  # S6864: explicit memory limit (litellm is Python; give it headroom).
  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 1Gi

web:
  # The skquad UI. Formerly `web-v2`; the v1 UI was retired 2026-09-26 and the
  # redesign was renamed to `web`. "web" now always means the redesigned UI.
  enabled: true
  imagePullPolicy: IfNotPresent
  port: 3000
  apiBaseUrl: /api/v1
  # Externally visible origin used for all app redirects, e.g.
  # https://skquad.rossbrigoli.com. Empty = derive from x-forwarded-*
  # headers, then the OIDC redirect URL's origin.
  publicBaseUrl: ""
  # S6864: explicit memory limit. S6870: the web container mounts the
  # next-image-cache emptyDir, so it also needs an explicit ephemeral-storage
  # request+limit (otherwise a runaway cache/log could evict the pod under
  # DiskPressure with no bound). S6892/S6897: explicit CPU request+limit so
  # the scheduler has a complete resource profile for this container.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
      ephemeral-storage: 512Mi
    limits:
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: 1Gi
  # Cap for the next-image-cache emptyDir (S6870 best practice: bound each
  # emptyDir individually, not just the container total).
  imageCacheSizeLimit: 256Mi
  # Pod runs as the image's non-root user (65532). fsGroup makes the
  # next-image-cache emptyDir group-writable so the Next.js image optimizer
  # can write /app/.next/cache/images under readOnlyRootFilesystem instead of
  # failing EACCES and re-optimizing every request.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  # UIv2-13: generic OIDC login (authorization code + PKCE). Works with any
  # IdP exposing .well-known/openid-configuration (Dex, Keycloak, Entra…).
  # When disabled the UI keeps the paste-a-token dev gate.
  oidc:
    enabled: false
    issuer: ""
    clientId: "skquad"
    redirectUrl: ""
    secretName: "skquad-web-oidc"
    clientSecretKey: "client-secret"
    scopes: "openid profile email offline_access"

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: skquad.local
      paths:
        - path: /api
          pathType: Prefix
          service: apiServer
        - path: /
          pathType: Prefix
          service: web
  tls: []

ingressRoute:
  enabled: false
  entryPoints:
    - web

# S-212: skquad-embedder — llama.cpp (Vulkan backend) serving
# Qwen3-Embedding-0.6B for agent memory RAG. Vendor-neutral GPU:
# the operator auto-detects nvidia.com/gpu, amd.com/gpu or
# gpu.intel.com/i915 on cluster nodes and binds the embedder to
# whichever is present; none found → CPU.
embedder:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/rossbrigoli/skquad-embedder
    tag: "0.1.0"
  imagePullPolicy: IfNotPresent
  model:
    name: qwen3-embed-0.6b
  args:
    - --model
    - /models/qwen3-embed-0.6b-q8_0.gguf
    - --embeddings
    - --pooling
    - last
    - --host
    - 0.0.0.0
    - --port
    - "8080"
    - --alias
    - qwen3-embed-0.6b
  gpu:
    # auto: GPU iff a supported resource exists on some node, else CPU.
    # gpu: force GPU (first resource in resourceNames). cpu: never GPU.
    mode: auto
    # Ordered vendor-neutral detection list (SKQUAD_GPU_RESOURCE_NAMES).
    resourceNames: "nvidia.com/gpu,amd.com/gpu,gpu.intel.com/i915"
    # Optional node label restricting GPU placement ("skquad.io/gpu").
    nodeLabelKey: ""
    # Host device paths mounted into the pod for Vulkan access.
    # /dev/dri covers AMD/Intel/ASPEED GPU render nodes; /dev/kfd
    # is required for AMD ROCm compute. Add both on AMD hosts.
    devicePaths: []
    # - /dev/dri
    # - /dev/kfd
  resources:
    requests:
      cpu: "1"
      memory: 1536Mi
    limits:
      memory: 2Gi
  nodeSelector: {}
  tolerations: []
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    runAsNonRoot: true
    runAsUser: 1000
