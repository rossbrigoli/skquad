{{- if .Values.webV2.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "skquad.webV2Name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: web-v2
spec:
  replicas: {{ .Values.replicas.webV2 }}
  selector:
    matchLabels:
      {{- include "skquad.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web-v2
  template:
    metadata:
      labels:
        {{- include "skquad.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web-v2
    spec:
      containers:
        - name: web-v2
          image: {{ include "skquad.webV2Image" . | quote }}
          imagePullPolicy: {{ .Values.webV2.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.webV2.port }}
              protocol: TCP
          env:
            - name: SKQUAD_API_BASE_URL
              value: {{ printf "http://%s.%s.svc.cluster.local/api/v1" (include "skquad.apiServerName" .) .Release.Namespace | quote }}
            - name: NEXT_PUBLIC_SKQUAD_API_BASE_URL
              value: {{ .Values.webV2.apiBaseUrl | quote }}
            {{- if .Values.webV2.publicBaseUrl }}
            # Externally visible origin. Required because Next.js resolves
            # request.url from its own bind address behind our proxy chain, which
            # would otherwise leak http://localhost:3000 into redirects.
            - name: SKQUAD_PUBLIC_BASE_URL
              value: {{ .Values.webV2.publicBaseUrl | quote }}
            {{- end }}
            {{- if .Values.webV2.oidc.enabled }}
            # UIv2-13: generic OIDC (authorization code + PKCE). Any IdP with
            # .well-known/openid-configuration works; cluster default is Dex.
            - name: SKQUAD_OIDC_ISSUER
              value: {{ .Values.webV2.oidc.issuer | quote }}
            - name: SKQUAD_OIDC_CLIENT_ID
              value: {{ .Values.webV2.oidc.clientId | quote }}
            - name: SKQUAD_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.webV2.oidc.secretName | quote }}
                  key: {{ .Values.webV2.oidc.clientSecretKey | quote }}
            - name: SKQUAD_OIDC_REDIRECT_URL
              value: {{ .Values.webV2.oidc.redirectUrl | quote }}
            - name: SKQUAD_OIDC_SCOPES
              value: {{ .Values.webV2.oidc.scopes | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.webV2.resources | nindent 12 }}
{{- end }}
