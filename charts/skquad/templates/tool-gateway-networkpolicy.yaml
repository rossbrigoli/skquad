{{- if .Values.toolGateway.enabled }}
# TG-1 NetworkPolicy topology for the Tool Gateway (design §5.4).
#
# Egress posture: the gateway is the ONLY component with general internet
# egress, but cluster-internal ranges are excluded from that blanket allow
# and re-opened only for CP, kube DNS, and the (future) Browser Service.
# NetworkPolicy is allow-only, so "deny all cluster-internal except X" is
# expressed as: public 0.0.0.0/0 minus cluster CIDRs, plus explicit peers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-tool-gateway-egress" (include "skquad.fullname" .) | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: tool-gateway
spec:
  podSelector:
    matchLabels:
      {{- include "skquad.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: tool-gateway
  policyTypes:
    - Egress
  egress:
    # kube DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Control plane internal API (policy reads)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "skquad.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api-server
      ports:
        - protocol: TCP
          port: http
    # Browser Service (TG-6, quarantine namespace). Gateway → browser pods
    # on the service port (control + MCP). Matches the live pod labels from
    # browser-service-deployment.yaml (component browser-service, container
    # port named http = {{ .Values.browserService.port }}). Inert until the
    # service exists.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.toolGateway.browserService.namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: {{ .Values.toolGateway.browserService.componentLabel }}
      ports:
        - protocol: TCP
          port: {{ .Values.browserService.port }}
    {{- if .Values.k8sMcp.enabled }}
    # MIG-7: scoped Kubernetes MCP server (k8s-mcp). The gateway is the ONLY
    # caller: registration enumerates tools through it (POST /internal/mcp/
    # enumerate) and every agent call is proxied (POST /v1/mcp/{id}/call).
    # Without this rule the blanket "public minus cluster CIDRs" egress allow
    # drops gateway → k8s-mcp, so registration fails hard (the CP deletes the
    # half-registered row) rather than leaving an unusable resource.
    # Port is the CONTAINER port (.Values.k8sMcp.port), not servicePort: a
    # podSelector matches post-DNAT traffic to podIP:targetPort.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "skquad.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: k8s-mcp
      ports:
        - protocol: TCP
          port: {{ .Values.k8sMcp.port }}
    {{- end }}
    # Public internet: 80,443 everywhere EXCEPT the cluster's own
    # pod/service CIDRs (configured via toolGateway.clusterCIDRs — adjust
    # to the actual cluster CIDRs; k3s defaults shipped).
    # NOTE (TG-9 drill finding 2 sibling fix, 2026-10-07): single `except:`
    # key — the previous per-iteration `except:` collapsed to the LAST CIDR
    # only. RFC1918 is intentionally NOT excluded here: internal-class
    # registrations legitimately reach private IPs through the gateway
    # (netguard AllowPrivate governs that at L7).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- range .Values.toolGateway.clusterCIDRs }}
              - {{ . }}
              {{- end }}
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
---
# Ingress to the gateway: only agent-namespace pods (label-managed by the
# squad operator's platform-egress policy on the agent side) plus the CP.
# We restrict ingress to same-cluster sources; semantic auth is at L7.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-tool-gateway-ingress" (include "skquad.fullname" .) | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: tool-gateway
spec:
  podSelector:
    matchLabels:
      {{- include "skquad.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: tool-gateway
  policyTypes:
    - Ingress
  ingress:
    # Any in-cluster source may reach the gateway's HTTP port; the gateway
    # itself enforces agent-credential authn. Restricting by agent-pod
    # labels here is impossible because squad namespaces are dynamic — the
    # agent-side allow (operator platform-egress policy) is the enforced
    # half of the pair.
    - ports:
        - protocol: TCP
          port: http
{{- end }}
