apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "skquad.operatorName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  replicas: {{ .Values.replicas.operator }}
  selector:
    matchLabels:
      {{- include "skquad.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        {{- include "skquad.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: {{ include "skquad.operatorName" . }}
      securityContext:
        {{- toYaml .Values.operator.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          image: {{ include "skquad.operatorImage" . | quote }}
          imagePullPolicy: {{ .Values.operator.imagePullPolicy }}
          args:
            - --leader-elect={{ .Values.operator.leaderElection }}
            - --metrics-bind-address={{ .Values.operator.metricsBindAddress }}
            - --health-probe-bind-address={{ .Values.operator.healthProbeBindAddress }}
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          env:
            - name: SKQUAD_AGENT_TASK_POLL_INTERVAL_SECONDS
              value: {{ .Values.agent.taskPollIntervalSeconds | quote }}
            - name: SKQUAD_AGENT_INBOX_POLL_INTERVAL_SECONDS
              value: {{ .Values.agent.inboxPollIntervalSeconds | quote }}
            - name: SKQUAD_AGENT_INBOX_BATCH_SIZE
              value: {{ .Values.agent.inboxBatchSize | quote }}
            - name: SKQUAD_AGENT_TASK_TIMEOUT_SECONDS
              value: {{ .Values.agent.taskTimeoutSeconds | quote }}
            - name: SKQUAD_AGENT_MAX_LLM_STEPS
              value: {{ .Values.agent.maxLLMSteps | quote }}
            - name: SKQUAD_AGENT_TASK_SUMMARY_MAX_CHARS
              value: {{ .Values.agent.taskSummaryMaxChars | quote }}
            # S-147 (WP6): SKQUAD_AGENT_PROMPT_FETCH_ENABLED removed —
            # the composed-prompt fetch is now mandatory in the runtime.
            # S-152/BT-5a (ADR-0012): operator-level default for the agent-pod
            # built-in tools kill switch (SKQUAD_BUILTIN_TOOLS_ENABLED).
            # Bool-aware: `false | default "true"` would wrongly yield "true",
            # so a real boolean is rendered via ternary.
            - name: SKQUAD_AGENT_BUILTIN_TOOLS_ENABLED
              {{- if kindIs "bool" .Values.agent.builtinToolsEnabled }}
              value: {{ ternary "true" "false" .Values.agent.builtinToolsEnabled | quote }}
              {{- else }}
              value: {{ default "true" .Values.agent.builtinToolsEnabled | quote }}
              {{- end }}
            - name: SKQUAD_API_SERVER_SERVICE_ACCOUNT_NAME
              value: {{ include "skquad.apiServerName" . | quote }}
            - name: SKQUAD_MAX_AGENT_STORAGE
              value: {{ .Values.operator.maxAgentStorage | quote }}
            # S-212: embedder GPU reconciliation knobs.
            - name: SKQUAD_EMBEDDER_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: SKQUAD_EMBEDDER_DEPLOYMENT
              value: {{ include "skquad.embedderName" . | quote }}
            - name: SKQUAD_EMBEDDER_GPU_MODE
              value: {{ .Values.embedder.gpu.mode | quote }}
            - name: SKQUAD_GPU_RESOURCE_NAMES
              value: {{ .Values.embedder.gpu.resourceNames | quote }}
            - name: SKQUAD_GPU_NODE_LABEL_KEY
              value: {{ .Values.embedder.gpu.nodeLabelKey | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.operator.securityContext | nindent 12 }}
