{{- $bg := .Values.breakGlass | default dict }}
{{- if and (default "" $bg.passwordHash) (default "" $bg.jwtKey) }}
# Rendered only when the credentials are supplied inline (local/dev convenience).
# In GitOps, leave passwordHash/jwtKey empty and create a SealedSecret named
# {{ default "skquad-breakglass" $bg.secretName }} with keys `password-hash` and
# `jwt-key` instead — generate both with:
#   go run ./control-plane/cmd/breakglass-hash
apiVersion: v1
kind: Secret
metadata:
  name: {{ default "skquad-breakglass" $bg.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: breakglass
type: Opaque
stringData:
  password-hash: {{ required "breakGlass.passwordHash is required when supplied inline" $bg.passwordHash }}
  jwt-key: {{ required "breakGlass.jwtKey is required when supplied inline" $bg.jwtKey }}
{{- end }}
