{{- /*
TG-10 (§6.6): shared internal token for the gateway→terminal-service
channel (Authorization: Bearer SKQUAD_TERMINAL_INTERNAL_TOKEN).
Direction-scoped and SEPARATE from the browser/gateway tokens.

Rendered in BOTH namespaces (secret refs cannot cross namespaces):
terminal quarantine ns (terminal-service reads) and the release ns
(tool-gateway reads). With .Values.terminalService.internalTokenSecret.name
set (SealedSecret), these templates render nothing and the external
secret must exist in both namespaces.
*/ -}}
{{- if and .Values.terminalService.enabled (not .Values.terminalService.internalTokenSecret.name) }}
{{- $secretName := include "skquad.terminalInternalTokenSecretName" . }}
{{- $key := .Values.terminalService.internalTokenSecret.key }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Values.terminalService.namespace }}
  labels:
    {{- include "skquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: terminal-service
type: Opaque
stringData:
  {{ $key }}: {{ .Values.terminalService.internalToken | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: tool-gateway
type: Opaque
stringData:
  {{ $key }}: {{ .Values.terminalService.internalToken | quote }}
{{- end }}
