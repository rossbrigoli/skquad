{{- if .Values.buildService.enabled }}
# MIG-8: dedicated build namespace. Kaniko Jobs never run in
# skquad-system; blast radius is this namespace only.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.buildService.namespace }}
  labels:
    {{- include "skquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: build-service
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
{{- end }}
