{{- /*
S-283 follow-on (browser activation): the control-plane-managed MCP
custody Secret for the seeded `platform-browser` resource
(migration 0060_browser_activation.sql, fixed id
736b7175-6164-4000-8000-0000000000b0).

Name and key layout are fixed by the custody contract:
  * kube.MCPSecretName  -> "skquad-mcp-" + resource id
  * bearer auth fields  -> data key "token"
    (control-plane/internal/httpapi/rest_credentials.go restAuthFields)
The CP resolves it via GET /internal/v1/credentials?resource=<id>
from the release namespace (SecretStore namespace).

NOTE: the TG-6 browser driver authenticates to the browser-service
with the gateway's SKQUAD_BROWSER_INTERNAL_TOKEN env (rendered by
browser-internal-secret.yaml), NOT by resolving this Secret. The
Secret exists so the resource's auth_ref resolves as a well-formed
bearer custody Secret (registration-shape consistency; the same
material, no new secret value introduced).

Rendered only when the inline `.Values.browserService.internalToken`
is used. With `.Values.browserService.internalTokenSecret.name` set
(external SealedSecret posture) this template renders nothing; the
operator does not need to create the custody Secret for the browser
driver to work, but may mirror the same token into
skquad-mcp-736b7175-6164-4000-8000-0000000000b0 (key "token") if
credential-API resolution is ever desired.
*/ -}}
{{- if and .Values.browserService.enabled (not .Values.browserService.internalTokenSecret.name) }}
apiVersion: v1
kind: Secret
metadata:
  name: skquad-mcp-736b7175-6164-4000-8000-0000000000b0
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: tool-gateway
    skquad.io/managed-custody: mcp
type: Opaque
stringData:
  token: {{ .Values.browserService.internalToken | quote }}
{{- end }}
