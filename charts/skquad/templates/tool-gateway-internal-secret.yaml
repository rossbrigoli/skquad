{{- /*
TG-5 (S-244-series): shared internal token for the CP→gateway MCP
enumerate direction. The gateway requires this on
POST /internal/mcp/enumerate (X-Skquad-Internal-Token); the control-plane
sends it and the drift scanner is gated on it. Direction-scoped and
SEPARATE from the gateway callback token (gateway→CP) so leaking one
direction's secret does not authenticate the other.

Mirrors the llm-gateway-secret pattern: rendered from the inline
`.Values.toolGateway.internalToken` when no external secret name is set.
For a hardened deployment, set `.Values.toolGateway.internalTokenSecret.name`
to a SealedSecret and this template renders nothing.
*/ -}}
{{- if not .Values.toolGateway.internalTokenSecret.name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "skquad.gatewayInternalTokenSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: tool-gateway
type: Opaque
stringData:
  {{ .Values.toolGateway.internalTokenSecret.key }}: {{ .Values.toolGateway.internalToken | quote }}
{{- end }}
