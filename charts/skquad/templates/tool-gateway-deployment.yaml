{{- if .Values.toolGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "skquad.toolGatewayName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: tool-gateway
spec:
  {{- if not .Values.toolGateway.autoscaling.enabled }}
  replicas: {{ .Values.replicas.toolGateway }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "skquad.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: tool-gateway
  template:
    metadata:
      labels:
        {{- include "skquad.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: tool-gateway
    spec:
      # The gateway never calls the Kubernetes API (TG-1) — no SA token.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tool-gateway
          image: {{ include "skquad.toolGatewayImage" . | quote }}
          imagePullPolicy: {{ .Values.toolGateway.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.toolGateway.port }}
              protocol: TCP
          env:
            - name: SKQUAD_TOOL_GATEWAY_ADDR
              value: {{ printf ":%d" (int .Values.toolGateway.port) | quote }}
            - name: SKQUAD_TOOL_GATEWAY_ENABLED
              value: {{ .Values.toolGateway.enabledRuntime | quote }}
            - name: SKQUAD_CP_BASE_URL
              value: {{ default (printf "http://%s.%s.svc.cluster.local:8080" (include "skquad.apiServerName" .) .Release.Namespace) .Values.toolGateway.controlPlaneUrl | quote }}
            - name: SKQUAD_TOOL_GATEWAY_POLICY_TTL
              value: {{ .Values.toolGateway.policyTtl | quote }}
            - name: SKQUAD_TOOL_GATEWAY_POLICY_TIMEOUT
              value: {{ .Values.toolGateway.policyTimeout | quote }}
            - name: SKQUAD_TOOL_GATEWAY_PROBE_GAP
              value: {{ .Values.toolGateway.probeGap | quote }}
            - name: SKQUAD_TOOL_GATEWAY_BOUNDARY_VERIFIER
              value: {{ .Values.toolGateway.boundaryVerifier | quote }}
            - name: SKQUAD_TOOL_GATEWAY_AUDIT_SINK
              value: "stdout"
            # TG-5: shared internal token for the CP→gateway MCP enumerate
            # direction. Optional so a deployment without it simply keeps the
            # enumerate endpoint disabled (503) rather than crash-looping.
            - name: SKQUAD_GATEWAY_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "skquad.gatewayInternalTokenSecretName" . }}
                  key: {{ .Values.toolGateway.internalTokenSecret.key }}
                  optional: true
            {{- if .Values.browserService.enabled }}
            # TG-6: token the gateway presents to the browser-service control
            # plane (POST/DELETE /v1/sessions, docs §1/§6). The service URL
            # itself is NOT an env var here — the browser driver reads it from
            # the resource's base_url config delivered by the CP (see
            # tool-gateway/internal/drivers/browser/policy.go). Empty token =
            # driver fails closed (denial), never unauthenticated calls.
            - name: SKQUAD_BROWSER_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "skquad.browserInternalTokenSecretName" . }}
                  key: {{ .Values.browserService.internalTokenSecret.key }}
                  optional: true
            {{- end }}
            {{- if .Values.terminalService.enabled }}
            # TG-10: gateway ssh driver → terminal-service channel.
            # Empty token = driver fails closed (denial), never
            # unauthenticated calls.
            - name: SKQUAD_TERMINAL_SERVICE_URL
              value: {{ printf "http://%s.%s.svc.cluster.local:%d" (include "skquad.terminalServiceName" .) .Values.terminalService.namespace (.Values.terminalService.port | int) | quote }}
            - name: SKQUAD_TERMINAL_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "skquad.terminalInternalTokenSecretName" . }}
                  key: {{ .Values.terminalService.internalTokenSecret.key }}
                  optional: true
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # Liveness: process up. Readiness: FAIL-CLOSED launch gate —
          # /readyz returns 503 until the CP policy path is proven
          # reachable AND the boundary verifier confirms the fence
          # (design §5.2). The pod receives no traffic until then.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            {{- toYaml .Values.toolGateway.resources | nindent 12 }}
      {{- with .Values.toolGateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.toolGateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
