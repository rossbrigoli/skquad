{{- $s := .Values.apiServer.search | default dict }}
{{- if or (default "" $s.braveApiKey) (default "" $s.perplexityApiKey) }}
# S-152/BT-5a (ADR-0012): rendered only when provider keys are supplied inline
# (local/dev convenience). In GitOps, leave the inline values empty and create a
# SealedSecret named {{ default "skquad-search-keys" $s.secretName }} with keys
# `brave-api-key` and/or `perplexity-api-key` instead. The api-server reads
# these via optional secretKeyRef; the agent runtime NEVER receives them (it uses
# the control-plane search proxy).
apiVersion: v1
kind: Secret
metadata:
  name: {{ default "skquad-search-keys" $s.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: search-keys
type: Opaque
stringData:
  {{- with (default "" $s.braveApiKey) }}
  brave-api-key: {{ . | quote }}
  {{- end }}
  {{- with (default "" $s.perplexityApiKey) }}
  perplexity-api-key: {{ . | quote }}
  {{- end }}
{{- end }}
