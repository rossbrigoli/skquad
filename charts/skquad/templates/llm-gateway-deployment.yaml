apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "skquad.llmGatewayName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: llm-gateway
spec:
  replicas: {{ .Values.replicas.llmGateway }}
  selector:
    matchLabels:
      {{- include "skquad.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: llm-gateway
  template:
    metadata:
      labels:
        {{- include "skquad.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: llm-gateway
    spec:
      # S6865: this pod never calls the Kubernetes API — do not mount a SA token.
      automountServiceAccountToken: false
      containers:
        - name: llm-gateway
          image: {{ include "skquad.llmGatewayImage" . | quote }}
          imagePullPolicy: {{ .Values.llmGateway.imagePullPolicy }}
          args:
            - --config
            - /etc/skquad/llm-gateway/config.yaml
            - --port
            - {{ .Values.llmGateway.port | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.llmGateway.port }}
              protocol: TCP
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "skquad.llmGatewayMasterKeySecretName" . }}
                  key: {{ .Values.llmGateway.masterKeySecret.key }}
            - name: LITELLM_MIGRATION_DIR
              value: {{ .Values.llmGateway.migrationDir | quote }}
            - name: SKQUAD_CONTROL_PLANE_URL
              value: {{ default (printf "http://%s.%s.svc.cluster.local" (include "skquad.apiServerName" .) .Release.Namespace) .Values.apiServer.runtimeControlPlaneUrl | quote }}
            - name: SKQUAD_GATEWAY_CALLBACK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "skquad.llmGatewayMasterKeySecretName" . }}
                  key: {{ .Values.llmGateway.masterKeySecret.key }}
            {{- if .Values.llmGateway.databaseUrlSecret.name }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.llmGateway.databaseUrlSecret.name }}
                  key: {{ .Values.llmGateway.databaseUrlSecret.key }}
            {{- else if .Values.llmGateway.databaseUrl }}
            - name: DATABASE_URL
              value: {{ .Values.llmGateway.databaseUrl | quote }}
            {{- else if .Values.postgres.enabled }}
            - name: DATABASE_URL
              value: {{ printf "postgres://%s:%s@%s:5432/%s?sslmode=disable&schema=litellm" .Values.postgres.user .Values.postgres.password (include "skquad.postgresName" .) .Values.postgres.database | quote }}
            {{- else if .Values.apiServer.databaseUrlSecret.name }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.apiServer.databaseUrlSecret.name }}
                  key: {{ .Values.apiServer.databaseUrlSecret.key }}
            {{- else if .Values.apiServer.databaseUrl }}
            - name: DATABASE_URL
              value: {{ .Values.apiServer.databaseUrl | quote }}
            {{- end }}
            {{- with .Values.llmGateway.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.llmGateway.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.llmGateway.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: http
            failureThreshold: {{ .Values.llmGateway.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.llmGateway.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.llmGateway.probes.startup.timeoutSeconds }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            failureThreshold: {{ .Values.llmGateway.probes.liveness.failureThreshold }}
            periodSeconds: {{ .Values.llmGateway.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.llmGateway.probes.liveness.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            failureThreshold: {{ .Values.llmGateway.probes.readiness.failureThreshold }}
            periodSeconds: {{ .Values.llmGateway.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.llmGateway.probes.readiness.timeoutSeconds }}
          volumeMounts:
            - name: config
              mountPath: /etc/skquad/llm-gateway
              readOnly: true
          resources:
            {{- toYaml .Values.llmGateway.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "skquad.llmGatewayName" . }}
