apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "skquad.apiServerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-server
spec:
  replicas: {{ .Values.replicas.apiServer }}
  selector:
    matchLabels:
      {{- include "skquad.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api-server
  template:
    metadata:
      labels:
        {{- include "skquad.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api-server
    spec:
      serviceAccountName: {{ include "skquad.apiServerName" . }}
      securityContext:
        {{- toYaml .Values.apiServer.podSecurityContext | nindent 8 }}
      containers:
        - name: api-server
          image: {{ include "skquad.apiServerImage" . | quote }}
          imagePullPolicy: {{ .Values.apiServer.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SKQUAD_ADDR
              value: ":8080"
            - name: SKQUAD_AUTH_MODE
              value: {{ .Values.apiServer.authMode | quote }}
            - name: SKQUAD_K8S_ENABLED
              value: "true"
            - name: SKQUAD_K8S_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: SKQUAD_AGENT_IMAGE
              value: {{ printf "%s:%s" .Values.image.agentRuntime.repository .Values.image.agentRuntime.tag | quote }}
            - name: SKQUAD_CONTROL_PLANE_URL
              value: {{ default (printf "http://%s.%s.svc.cluster.local" (include "skquad.apiServerName" .) .Release.Namespace) .Values.apiServer.runtimeControlPlaneUrl | quote }}
            - name: SKQUAD_LLM_GATEWAY_URL
              value: {{ default (printf "http://%s.%s.svc.cluster.local:%v" (include "skquad.llmGatewayName" .) .Release.Namespace .Values.llmGateway.port) .Values.apiServer.runtimeLlmGatewayUrl | quote }}
            - name: SKQUAD_LITELLM_ADMIN_URL
              value: {{ default (printf "http://%s.%s.svc.cluster.local:%v" (include "skquad.llmGatewayName" .) .Release.Namespace .Values.llmGateway.port) .Values.apiServer.runtimeLlmGatewayUrl | quote }}
            - name: SKQUAD_LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "skquad.llmGatewayMasterKeySecretName" . }}
                  key: {{ .Values.llmGateway.masterKeySecret.key }}
            - name: SKQUAD_GATEWAY_CALLBACK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "skquad.llmGatewayMasterKeySecretName" . }}
                  key: {{ .Values.llmGateway.masterKeySecret.key }}
            - name: SKQUAD_MEMORY_EMBEDDINGS_ENABLED
              value: {{ .Values.apiServer.memoryEmbeddings.enabled | quote }}
            - name: SKQUAD_MEMORY_EMBEDDING_MODEL
              value: {{ .Values.apiServer.memoryEmbeddings.model | quote }}
            - name: SKQUAD_DEFAULT_IDLE_TIMEOUT
              value: {{ .Values.agent.idleTimeout | quote }}
            {{- if .Values.apiServer.databaseUrlSecret.name }}
            - name: SKQUAD_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.apiServer.databaseUrlSecret.name }}
                  key: {{ .Values.apiServer.databaseUrlSecret.key }}
            {{- else if .Values.apiServer.databaseUrl }}
            - name: SKQUAD_DATABASE_URL
              value: {{ .Values.apiServer.databaseUrl | quote }}
            {{- else if .Values.postgres.enabled }}
            - name: SKQUAD_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "skquad.postgresSecretName" . }}
                  key: {{ .Values.postgres.secretKeys.databaseUrl }}
            {{- end }}
            {{- if eq .Values.apiServer.authMode "oidc" }}
            - name: SKQUAD_OIDC_ISSUER
              value: {{ .Values.apiServer.oidc.issuer | quote }}
            - name: SKQUAD_OIDC_AUDIENCE
              value: {{ .Values.apiServer.oidc.audience | quote }}
            - name: SKQUAD_OIDC_ADMIN_GROUPS
              value: {{ .Values.apiServer.oidc.adminGroups | join "," | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.apiServer.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.apiServer.securityContext | nindent 12 }}
