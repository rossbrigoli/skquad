{{- if .Values.ingressRoute.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "skquad.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skquad.labels" . | nindent 4 }}
spec:
  entryPoints:
    {{- toYaml .Values.ingressRoute.entryPoints | nindent 4 }}
  routes:
    {{- range .Values.ingress.hosts }}
    {{- $host := .host }}
    {{- range .paths }}
    - kind: Rule
      {{- if eq .path "/" }}
      match: {{ printf "Host(`%s`)" $host | quote }}
      {{- else }}
      match: {{ printf "Host(`%s`) && PathPrefix(`%s`)" $host .path | quote }}
      {{- end }}
      services:
        - name: {{- if eq .service "apiServer" }} {{ include "skquad.apiServerName" $ }}{{- else if eq .service "llmGateway" }} {{ include "skquad.llmGatewayName" $ }}{{- else if eq .service "web" }} {{ include "skquad.webName" $ }}{{- else }}{{- fail (printf "unknown ingressRoute service %q" .service) }}{{- end }}
          port: http
    {{- end }}
    {{- end }}
{{- end }}
