{{- /*
TG-6 (docs/tg6-browser-protocol.md §1): shared internal token for the
gateway→browser-service control plane (Authorization: Bearer
SKQUAD_BROWSER_INTERNAL_TOKEN on POST/DELETE /v1/sessions, sweeper).
Direction-scoped and SEPARATE from the gateway's own internal token.

Mirrors the tool-gateway-internal-secret pattern: rendered from the inline
`.Values.browserService.internalToken` when no external secret name is set.
For a hardened deployment, set `.Values.browserService.internalTokenSecret.name`
to a SealedSecret and these templates render nothing.

The SAME secret must exist in TWO namespaces because Kubernetes secretKeyRef
cannot cross namespaces: the quarantine namespace (browser-service reads it)
and the release namespace (tool-gateway reads it). Both are rendered here
from the same values. With an override name, the external secret must be
created in both namespaces.
*/ -}}
{{- if and .Values.browserService.enabled (not .Values.browserService.internalTokenSecret.name) }}
{{- $secretName := include "skquad.browserInternalTokenSecretName" . }}
{{- $key := .Values.browserService.internalTokenSecret.key }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Values.browserService.namespace }}
  labels:
    {{- include "skquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: browser-service
type: Opaque
stringData:
  {{ $key }}: {{ .Values.browserService.internalToken | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: tool-gateway
type: Opaque
stringData:
  {{ $key }}: {{ .Values.browserService.internalToken | quote }}
{{- end }}
