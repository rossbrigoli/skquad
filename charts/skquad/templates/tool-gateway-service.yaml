{{- if .Values.toolGateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "skquad.toolGatewayName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: tool-gateway
spec:
  type: ClusterIP
  selector:
    {{- include "skquad.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: tool-gateway
  ports:
    - name: http
      port: {{ .Values.toolGateway.port }}
      targetPort: http
      protocol: TCP
{{- end }}
