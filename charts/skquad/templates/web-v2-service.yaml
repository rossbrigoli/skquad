{{- if .Values.webV2.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "skquad.webV2Name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: web-v2
spec:
  type: ClusterIP
  selector:
    {{- include "skquad.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web-v2
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
{{- end }}
