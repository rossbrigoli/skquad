{{- if .Values.buildService.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "skquad.buildServiceName" . }}
  namespace: {{ .Values.buildService.namespace }}
  labels:
    {{- include "skquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: build-service
---
# MIG-8: kaniko build pods run under this SA. It deliberately has NO
# RBAC binding and automount is disabled — kaniko never calls the API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.buildService.kanikoServiceAccount }}
  namespace: {{ .Values.buildService.namespace }}
  labels:
    {{- include "skquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: build-service
automountServiceAccountToken: false
{{- end }}
