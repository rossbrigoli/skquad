apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "skquad.operatorName" . }}
  labels:
    {{- include "skquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
rules:
  - apiGroups:
      - skquad.io
    resources:
      - squads
      - agents
    verbs:
      - get
      - list
      - watch
      - patch
      - update
  - apiGroups:
      - skquad.io
    resources:
      - squads/status
      - agents/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
      - delete
  # S-212: the embedder GPU reconciler lists cluster Nodes to decide
  # GPU vs CPU placement. Read-only, cluster-scoped, minimal.
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list
      # ADR-0013: the embedder runtime layer watches Nodes to keep GPU
      # detection (cuda/vulkan/cpu) current without polling.
      - watch
  # ADR-0013: embedder runtime override ConfigMap, read by fixed name
  # (cache-bypassed in the manager; see operator/cmd/manager/main.go).
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
    resourceNames:
      - skquad-embedder-config
  # S-287: direct (cache-bypassed) read of the agent-resources
  # override ConfigMap written by the control-plane Settings UI.
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
    resourceNames:
      - skquad-agent-resources
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  # The operator must hold the secrets verbs it grants to the API server's
  # secret-writer Role: RBAC escalation prevention forbids granting
  # permissions the grantor does not hold. list/watch are withheld — the
  # operator can never enumerate cluster secrets, only touch specific
  # names it is told about (and it never reads contents; see ADR-0009).
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - create
      - patch
      - update
      - delete
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - create
  # S-135: per-agent durable workspace PVCs (create + lifecycle). The
  # operator never reads volume contents; it only manages claim
  # lifecycle in squad namespaces.
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims/status
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - get
      - patch
      - update
      - delete
    resourceNames:
      - skquad-agent
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
      - rolebindings
    verbs:
      - create
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
      - rolebindings
    verbs:
      - get
      - patch
      - update
      - delete
    resourceNames:
      - skquad-api-agent-secret-writer
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
      - delete
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - create
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - get
      - patch
      - update
      - delete
    resourceNames:
      - default-deny
      - allow-dns-egress
      - allow-skquad-platform-egress
      - allow-granted-egress
  - apiGroups:
      - ""
    resources:
      - resourcequotas
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - resourcequotas
    verbs:
      - get
      - patch
      - update
      - delete
    resourceNames:
      - skquad-squad-quota
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - patch
      - update
      - delete
    resourceNames:
      - skquad-operator.skquad.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "skquad.operatorName" . }}
  labels:
    {{- include "skquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "skquad.operatorName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "skquad.operatorName" . }}
    namespace: {{ .Release.Namespace }}
---
# S-287: the Agent controller watches the agent-resources override
# ConfigMap (skquad-agent-resources) so a Settings → Platform edit
# converges every agent Deployment without a redeploy. list/watch cannot
# be name-scoped via resourceNames, so this Role confines the watch to
# the release namespace — matching the manager's namespace-scoped
# ConfigMap informer (operator/cmd/manager/main.go).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "skquad.operatorName" . }}-configmap-watch
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "skquad.operatorName" . }}-configmap-watch
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "skquad.operatorName" . }}-configmap-watch
subjects:
  - kind: ServiceAccount
    name: {{ include "skquad.operatorName" . }}
    namespace: {{ .Release.Namespace }}
