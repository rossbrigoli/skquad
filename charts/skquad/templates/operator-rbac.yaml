apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "skquad.operatorName" . }}
  labels:
    {{- include "skquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
rules:
  - apiGroups:
      - skquad.io
    resources:
      - squads
      - agents
    verbs:
      - get
      - list
      - watch
      - patch
      - update
  - apiGroups:
      - skquad.io
    resources:
      - squads/status
      - agents/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  # The operator must hold the secrets verbs it grants to the API server's
  # secret-writer Role: RBAC escalation prevention forbids granting
  # permissions the grantor does not hold. list/watch are withheld — the
  # operator can never enumerate cluster secrets, only touch specific
  # names it is told about (and it never reads contents; see ADR-0009).
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - create
      - patch
      - update
      - delete
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - create
  # S-135: per-agent durable workspace PVCs (create + lifecycle). The
  # operator never reads volume contents; it only manages claim
  # lifecycle in squad namespaces.
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims/status
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - get
      - patch
      - update
      - delete
    resourceNames:
      - skquad-agent
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
      - rolebindings
    verbs:
      - create
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
      - rolebindings
    verbs:
      - get
      - patch
      - update
      - delete
    resourceNames:
      - skquad-api-agent-secret-writer
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
      - delete
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - create
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - get
      - patch
      - update
      - delete
    resourceNames:
      - default-deny
      - allow-dns-egress
      - allow-skquad-platform-egress
      - allow-granted-egress
  - apiGroups:
      - ""
    resources:
      - resourcequotas
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - resourcequotas
    verbs:
      - get
      - patch
      - update
      - delete
    resourceNames:
      - skquad-squad-quota
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - patch
      - update
      - delete
    resourceNames:
      - skquad-operator.skquad.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "skquad.operatorName" . }}
  labels:
    {{- include "skquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "skquad.operatorName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "skquad.operatorName" . }}
    namespace: {{ .Release.Namespace }}
