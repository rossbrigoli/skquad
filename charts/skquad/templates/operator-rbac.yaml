apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "skquad.operatorName" . }}
  labels:
    {{- include "skquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
rules:
  - apiGroups:
      - skquad.io
    resources:
      - squads
      - agents
    verbs:
      - get
      - list
      - watch
      - patch
      - update
  - apiGroups:
      - skquad.io
    resources:
      - squads/status
      - agents/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
      - delete
  # Fixed-name resources: no list/watch (prevents enumeration) and no
  # Secrets access at all. resourceNames cannot scope `create` for
  # top-level resources (kubernetes.io/docs/reference/access-authn-authz/rbac/),
  # so create stays type-scoped while get/update/patch/delete are
  # name-scoped. The operator reads these types uncached (main.go).
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - get
      - patch
      - update
      - delete
    resourceNames:
      - skquad-agent
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
      - rolebindings
    verbs:
      - create
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
      - rolebindings
    verbs:
      - get
      - patch
      - update
      - delete
    resourceNames:
      - skquad-api-agent-secret-writer
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
      - delete
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - create
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - get
      - patch
      - update
      - delete
    resourceNames:
      - default-deny
      - allow-dns-egress
      - allow-skquad-platform-egress
      - allow-granted-egress
  - apiGroups:
      - ""
    resources:
      - resourcequotas
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - resourcequotas
    verbs:
      - get
      - patch
      - update
      - delete
    resourceNames:
      - skquad-squad-quota
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - patch
      - update
      - delete
    resourceNames:
      - skquad-operator.skquad.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "skquad.operatorName" . }}
  labels:
    {{- include "skquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "skquad.operatorName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "skquad.operatorName" . }}
    namespace: {{ .Release.Namespace }}
