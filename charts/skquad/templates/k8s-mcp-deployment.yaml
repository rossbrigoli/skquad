{{- if .Values.k8sMcp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "skquad.k8sMcpName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: k8s-mcp
spec:
  replicas: {{ .Values.replicas.k8sMcp }}
  selector:
    matchLabels:
      {{- include "skquad.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: k8s-mcp
  template:
    metadata:
      labels:
        {{- include "skquad.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: k8s-mcp
    spec:
      serviceAccountName: {{ include "skquad.k8sMcpName" . }}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: k8s-mcp
          image: {{ include "skquad.k8sMcpImage" . | quote }}
          imagePullPolicy: {{ .Values.k8sMcp.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.k8sMcp.port }}
              protocol: TCP
          env:
            - name: K8SMCP_ADDR
              value: {{ printf ":%d" (int .Values.k8sMcp.port) | quote }}
            - name: K8SMCP_AUTH_TOKEN_FILE
              value: /etc/k8s-mcp-auth/token
            - name: K8SMCP_ALLOWED_NAMESPACES
              value: {{ join "," .Values.k8sMcp.readNamespaces | quote }}
            - name: K8SMCP_ARGOCD_NAMESPACE
              value: {{ .Values.k8sMcp.argoNamespace | quote }}
            - name: K8SMCP_ARGO_ALLOWED_APPS
              value: {{ join "," .Values.k8sMcp.argoAllowedApps | quote }}
            - name: K8SMCP_MAX_LOG_LINES
              value: {{ .Values.k8sMcp.maxLogLines | quote }}
          volumeMounts:
            - name: auth-token
              mountPath: /etc/k8s-mcp-auth
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.k8sMcp.resources | nindent 12 }}
      volumes:
        - name: auth-token
          secret:
            secretName: {{ .Values.k8sMcp.authTokenSecret.name }}
            items:
              - key: {{ .Values.k8sMcp.authTokenSecret.key }}
                path: token
        - name: tmp
          emptyDir: {}
{{- end }}
