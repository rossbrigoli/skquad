{{- if .Values.terminalService.enabled }}
{{- /*
TG-10 (§6.6): terminal-service — the quarantine-side SSH executor.
Receives already-governed exec/session requests from the tool-gateway
ssh driver (bearer SKQUAD_TERMINAL_INTERNAL_TOKEN). Holds the SSH
signing/credential path; agents never see any of it.

Storage: session recordings go to S3-compatible object storage
(MinIO in this cluster, path-style).
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "skquad.terminalServiceName" . }}-recording
  namespace: {{ .Values.terminalService.namespace }}
  labels:
    {{- include "skquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: terminal-service
type: Opaque
stringData:
  access-key: {{ .Values.terminalService.recording.accessKey | quote }}
  secret-key: {{ .Values.terminalService.recording.secretKey | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "skquad.terminalServiceName" . }}
  namespace: {{ .Values.terminalService.namespace }}
  labels:
    {{- include "skquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: terminal-service
spec:
  replicas: {{ .Values.terminalService.replicas }}
  selector:
    matchLabels:
      {{- include "skquad.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: terminal-service
  template:
    metadata:
      labels:
        {{- include "skquad.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: terminal-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: terminal-service
          image: {{ include "skquad.terminalServiceImage" . | quote }}
          imagePullPolicy: {{ .Values.terminalService.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.terminalService.port }}
              name: http
          env:
            - name: SKQUAD_TERMINAL_PORT
              value: {{ .Values.terminalService.port | quote }}
            - name: SKQUAD_TERMINAL_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "skquad.terminalInternalTokenSecretName" . }}
                  key: {{ .Values.terminalService.internalTokenSecret.key }}
            - name: SKQUAD_STEP_CA_URL
              value: {{ printf "https://%s.%s.svc.cluster.local:%d" (include "skquad.stepCAName" .) .Values.terminalService.namespace (.Values.terminalService.stepCA.port | int) | quote }}
            - name: SKQUAD_STEP_CA_PROVISIONER
              value: {{ .Values.terminalService.stepCA.provisioner | quote }}
            - name: SKQUAD_STEP_CA_PROVISIONER_PASSWORD_FILE
              value: /secrets/step/provisioner-password.txt
            - name: SKQUAD_RECORDING_S3_ENDPOINT
              value: {{ .Values.terminalService.recording.endpoint | quote }}
            - name: SKQUAD_RECORDING_S3_BUCKET
              value: {{ .Values.terminalService.recording.bucket | quote }}
            - name: SKQUAD_RECORDING_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "skquad.terminalServiceName" . }}-recording
                  key: access-key
            - name: SKQUAD_RECORDING_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "skquad.terminalServiceName" . }}-recording
                  key: secret-key
            - name: SKQUAD_RECORDING_S3_FORCE_PATH_STYLE
              value: "true"
            - name: SKQUAD_TERMINAL_MAX_SESSIONS
              value: {{ .Values.terminalService.maxSessions | quote }}
            - name: SKQUAD_TERMINAL_SESSION_IDLE_TIMEOUT_SECONDS
              value: {{ .Values.terminalService.sessionIdleTimeoutSeconds | quote }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: step-provisioner-secret
              mountPath: /secrets/step
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: "100m"
              memory: 128Mi
            limits:
              memory: 512Mi
              ephemeral-storage: 512Mi
      volumes:
        - name: step-provisioner-secret
          secret:
            secretName: {{ include "skquad.stepCAName" . }}-passwords
            defaultMode: 0400
        - name: tmp
          emptyDir: {}
{{- end }}
