apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "skquad.apiServerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-server
rules:
  # S-155: the control-plane creates/updates the provider API-key
  # Secrets pasted in the Settings UI (names skquad-provider-key-*).
  # Namespace-scoped Role; agent namespaces never granted here.
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - create
      - update
      - patch
      - delete
  # S-162: the Restart Agent button deletes the agent's pods by label
  # (skquad.io/agent-id); the owning Deployment recreates them.
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - delete
      - list
  # S-212 (ADR-0013 §5): the Settings UI's embedder-runtime choice is
  # written to ConfigMap skquad-embedder-config for the operator to
  # reconcile. create cannot be name-scoped; read/update/patch are
  # pinned to the single override name.
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - skquad-embedder-config
    verbs:
      - get
      - update
      - patch
  # S-GWREG: rollout-restart the LiteLLM gateway Deployment after model
  # deployment changes (the litellm router only picks up DB-persisted
  # models on pod restart — see docs/llm-gateway.md). Strategic-merge
  # patch of the pod-template annotation skquad.io/gateway-reload.
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - patch
  - apiGroups:
      - skquad.io
    resources:
      - squads
      - agents
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "skquad.apiServerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "skquad.apiServerName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "skquad.apiServerName" . }}
    namespace: {{ .Release.Namespace }}
