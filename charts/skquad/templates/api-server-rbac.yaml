apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "skquad.apiServerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-server
rules:
  # S-155: the control-plane creates/updates the provider API-key
  # Secrets pasted in the Settings UI (names skquad-provider-key-*).
  # Namespace-scoped Role; agent namespaces never granted here.
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - skquad.io
    resources:
      - squads
      - agents
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "skquad.apiServerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "skquad.apiServerName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "skquad.apiServerName" . }}
    namespace: {{ .Release.Namespace }}
