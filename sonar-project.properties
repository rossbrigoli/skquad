# SonarQube scan configuration for skquad (Kanbunny S-102).
#
# The scan runs on the in-cluster self-hosted runner (label: skquad) because
# SonarQube is not reachable from GitHub-hosted runners: the public URL sits
# behind Cloudflare Access, so only in-cluster traffic (sonarqube.lab /
# sonarqube-sonarqube.sonarqube.svc.cluster.local) can reach it.
#
# Host URL and token are supplied by the workflow (SONAR_URL / SONAR_TOKEN).
# Failure policy lives in scripts/sonar-severity-gate.py: any open
# Critical/High finding fails CI and is mirrored to a Kanbunny card.

sonar.projectKey=skquad
sonar.projectName=skquad
sonar.projectVersion=0.1.0

sonar.sources=control-plane,operator,agent-runtime,llm-gateway,web,charts,scripts
sonar.sourceEncoding=UTF-8

# S-171: test-file scoping. The generic test-execution importer only accepts
# files indexed as TEST files, so co-located tests (*_test.go, *.test.tsx)
# and the Python tests/ dirs are declared here and removed from main sources
# via sonar.exclusions below (main/test sets must be disjoint).
# sonar.test.inclusions selects only the test files inside those directories.
sonar.tests=agent-runtime/tests,llm-gateway/tests,control-plane,operator,web/src,tests
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx,**/tests/test_*.py

sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/coverage/**,**/.venv/**,**/venv/**,**/__pycache__/**,**/bin/**,**/*.min.js,**/*.min.css,**/*.map,**/*.svg,**/*.png,**/kubeconfig,**/*.local.yaml,agent-runtime/tests/**,llm-gateway/tests/**,**/*_test.go,**/*.test.ts,**/*.test.tsx

# Coverage is produced by the component CI jobs and downloaded by the
# security-sonar job before the scanner runs.
sonar.go.coverage.reportPaths=control-plane/coverage.out,operator/coverage.out
sonar.python.coverage.reportPaths=agent-runtime/coverage.xml,llm-gateway/coverage.xml
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info

# Test execution metadata (counts/failures/durations) for every stack, in
# SonarQube's generic test execution format (S-171). The security-sonar job
# downloads the per-component tests-<name> artifacts into test-results/.
# Wildcards are NOT supported here — list the expected files explicitly, and
# note a missing listed file FAILS the scan, so every component job always
# produces its report file (the converter emits an empty report if needed).
# Format: https://docs.sonarsource.com/sonarqube-server/analyzing-source-code/test-coverage/generic-test-data
sonar.testExecutionReportPaths=test-results/control-plane.xml,test-results/operator.xml,test-results/agent-runtime.xml,test-results/llm-gateway.xml,test-results/web.xml

# Coverage is reported to SonarQube for visibility (overall + new code).
# Enforcement stays with the component CI gates (go-coverage-gate.py,
# coverage --fail-under, vitest thresholds); the severity gate script keeps
# failing CI on Critical/High findings.

# Keep test sources analyzed (quality profiles apply), but exclude them from
# duplication noise where the framework repeats itself.
sonar.cpd.exclusions=**/tests/**,**/*_test.go,**/*.test.ts,**/*.test.tsx
