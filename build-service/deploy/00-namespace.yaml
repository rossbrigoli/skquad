# MIG-8: dedicated build namespace. Kaniko Jobs for agent-initiated
# builds run ONLY here — never in agent or platform namespaces.
#
# Pod Security: `baseline` enforce — kaniko must run as root INSIDE its
# own (unprivileged, caps-dropped, no-escalation) container to assemble
# image layers; `restricted` would forbid that. Audit stays restricted
# so drift is visible.
apiVersion: v1
kind: Namespace
metadata:
  name: skquad-builds
  labels:
    app.kubernetes.io/part-of: skquad
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
